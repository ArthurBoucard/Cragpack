name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: cragpack-debug-apk, path: androidApp/build/outputs/apk/debug/*.apk }

  # No local Mac: this job is what proves the iOS side still builds.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Build the iOS app for the simulator
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
