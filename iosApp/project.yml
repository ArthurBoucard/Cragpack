# XcodeGen spec. The .xcodeproj is generated, not committed: on a Mac run `brew install xcodegen && xcodegen` in this folder.
name: iosApp
options:
  bundleIdPrefix: app.cragpack
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Cragpack
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        # ponytail: placeholder id until the name is secured (D13).
        PRODUCT_BUNDLE_IDENTIFIER: app.cragpack
        PRODUCT_NAME: Cragpack
        # Shared is a static framework: its SQLite use (SQLDelight's native driver) must be linked here.
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared", "-lsqlite3"]
        # Kotlin builds the simulator framework for Apple silicon only (iosSimulatorArm64).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED being set to YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
